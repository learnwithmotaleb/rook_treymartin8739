openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Rook — AI-powered identity protection API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User profile operations
  - name: accounts
    description: Connected social account operations
  - name: scan
    description: Identity scan operations
  - name: threats
    description: Threat detection and management
  - name: fingerprint
    description: Identity fingerprint operations
  - name: ai
    description: AI analysis endpoints
  - name: waitlist
    description: Waitlist signup operations
paths:
  /waitlist:
    post:
      operationId: joinWaitlist
      tags: [waitlist]
      summary: Join the waitlist
      description: Add an email address to the launch waitlist. Duplicate submissions are silently deduplicated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitlistInput"
      responses:
        "200":
          description: Signup recorded (or already on the list)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistEntry"
        "400":
          description: Invalid email

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /reviewer/demo:
    get:
      operationId: getReviewerDemo
      tags: [users]
      summary: Get the authenticated designated reviewer's read-only demo
      description: Returns fictional, clearly marked fixture data only. Requires normal authentication and the server-designated reviewer identity; other authenticated users receive 404. This read-only fixture endpoint intentionally precedes the legal-compliance gate so reviewers can preview it before onboarding or legal acknowledgements. Real product routes remain subject to the existing Terms and age gates; this endpoint writes no feature state and does not invoke social-network, photo-analysis, or scan providers.
      responses:
        "200":
          description: Reviewer demo fixture
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewerDemoResponse"
        "404":
          description: This authenticated account is not designated for reviewer demo access; mode is explicitly live
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewerDemoNotAuthorized"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile
      parameters:
        - in: header
          name: x-user-id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User profile with fingerprint stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      summary: List connected social accounts
      parameters:
        - in: header
          name: x-user-id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of connected accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConnectedAccount"
    post:
      operationId: connectAccount
      tags: [accounts]
      summary: Connect a social account
      parameters:
        - in: header
          name: x-user-id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectAccountBody"
      responses:
        "201":
          description: Account connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectedAccount"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /accounts/{accountId}:
    delete:
      operationId: disconnectAccount
      tags: [accounts]
      summary: Disconnect a social account
      parameters:
        - in: header
          name: x-user-id
          required: true
          schema:
            type: string
        - in: path
          name: accountId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Account disconnected
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /scan:
    post:
      operationId: startScan
      tags: [scan]
      summary: Start a new identity protection scan
      parameters:
        - in: header
          name: x-user-id
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Scan job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanJob"

  /scan/{jobId}:
    get:
      operationId: getScanStatus
      tags: [scan]
      summary: Get scan job status
      parameters:
        - in: header
          name: x-user-id
          required: true
          schema:
            type: string
        - in: path
          name: jobId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Scan job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanJob"
        "404":
          description: Scan job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /threats:
    get:
      operationId: listThreats
      tags: [threats]
      summary: List threats for the current user
      parameters:
        - in: header
          name: x-user-id
          required: true
          schema:
            type: string
        - in: query
          name: severity
          schema:
            type: string
            enum: [high, medium, low]
        - in: query
          name: resolved
          schema:
            type: boolean
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of threats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ThreatSummary"

  /threats/{threatId}:
    get:
      operationId: getThreat
      tags: [threats]
      summary: Get full threat detail
      parameters:
        - in: header
          name: x-user-id
          required: true
          schema:
            type: string
        - in: path
          name: threatId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Full threat detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreatDetail"
        "404":
          description: Threat not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /threats/{threatId}/resolve:
    patch:
      operationId: resolveThreat
      tags: [threats]
      summary: Mark a threat as resolved
      parameters:
        - in: header
          name: x-user-id
          required: true
          schema:
            type: string
        - in: path
          name: threatId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Threat resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreatDetail"
        "404":
          description: Threat not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /fingerprint:
    get:
      operationId: getFingerprint
      tags: [fingerprint]
      summary: Get identity fingerprint for the current user
      parameters:
        - in: header
          name: x-user-id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Identity fingerprint data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityFingerprint"

  /ai/analyze-scam:
    post:
      operationId: analyzeScam
      tags: [ai]
      summary: Analyze text for scam patterns using AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeScamBody"
      responses:
        "200":
          description: Scam analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScamAnalysisResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ai/generate-explanation:
    post:
      operationId: generateExplanation
      tags: [ai]
      summary: Generate AI explanation for a threat
      parameters:
        - in: header
          name: x-user-id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateExplanationBody"
      responses:
        "200":
          description: Generated explanation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExplanationResult"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    ReviewerDemoNotAuthorized:
      type: object
      properties:
        error:
          type: string
          enum: [reviewer_demo_not_authorized]
        mode:
          type: string
          enum: [live]
      required:
        - error
        - mode

    UserProfile:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        username:
          type: string
        avatarInitials:
          type: string
        isPremium:
          type: boolean
        securityScore:
          type: integer
        scoreTrend:
          type: integer
        monitored:
          type: integer
        lastScan:
          type: string
        totalPhotosIndexed:
          type: integer
        totalCaptionsIndexed:
          type: integer
        reelsIndexed:
          type: integer
        fingerprintUpdated:
          type: string
      required:
        - id
        - name
        - email
        - username
        - avatarInitials
        - isPremium
        - securityScore
        - scoreTrend
        - monitored
        - lastScan
        - totalPhotosIndexed
        - totalCaptionsIndexed
        - reelsIndexed
        - fingerprintUpdated

    ConnectedAccount:
      type: object
      properties:
        id:
          type: string
        platform:
          type: string
        username:
          type: string
        displayName:
          type: string
          nullable: true
        followers:
          type: integer
        verified:
          type: boolean
        photosIndexed:
          type: integer
        captionsIndexed:
          type: integer
        reelsIndexed:
          type: integer
        lastSynced:
          type: string
          nullable: true
      required:
        - id
        - platform
        - username
        - followers
        - verified
        - photosIndexed
        - captionsIndexed
        - reelsIndexed

    ConnectAccountBody:
      type: object
      properties:
        platform:
          type: string
          enum: [instagram, x, tiktok, linkedin, youtube, facebook, snapchat]
        username:
          type: string
        accessToken:
          type: string
          nullable: true
      required:
        - platform
        - username

    ScanJob:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed]
        progress:
          type: integer
        currentStep:
          type: string
          nullable: true
        threatsFound:
          type: integer
        startedAt:
          type: string
          nullable: true
        completedAt:
          type: string
          nullable: true
      required:
        - id
        - status
        - progress
        - threatsFound

    ThreatEvidence:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        similarity:
          type: integer
        label:
          type: string
        yourCaption:
          type: string
          nullable: true
        stolenCaption:
          type: string
          nullable: true
      required:
        - id
        - type
        - similarity
        - label

    ThreatScoreBreakdown:
      type: object
      properties:
        mediaSimilarity:
          type: integer
        contentReuse:
          type: integer
        profileSimilarity:
          type: integer
        bioSimilarity:
          type: integer
        usernameSimilarity:
          type: integer
        behavioral:
          type: integer
      required:
        - mediaSimilarity
        - contentReuse
        - profileSimilarity
        - bioSimilarity
        - usernameSimilarity
        - behavioral

    ThreatSummary:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        severity:
          type: string
        platform:
          type: string
          nullable: true
        title:
          type: string
        description:
          type: string
        threatScore:
          type: integer
        matchedMediaCount:
          type: integer
        suspiciousUsername:
          type: string
          nullable: true
        resolved:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - type
        - severity
        - title
        - description
        - threatScore
        - matchedMediaCount
        - resolved
        - createdAt

    ThreatDetail:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        severity:
          type: string
        platform:
          type: string
          nullable: true
        title:
          type: string
        description:
          type: string
        details:
          type: string
        aiExplanation:
          type: string
          nullable: true
        threatScore:
          type: integer
        suspiciousUsername:
          type: string
          nullable: true
        matchedMediaCount:
          type: integer
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/ThreatEvidence"
        scoreBreakdown:
          $ref: "#/components/schemas/ThreatScoreBreakdown"
          nullable: true
        detectedSignals:
          type: array
          items:
            type: string
        resolved:
          type: boolean
        resolvedAt:
          type: string
          nullable: true
        createdAt:
          type: string
      required:
        - id
        - type
        - severity
        - title
        - description
        - details
        - threatScore
        - matchedMediaCount
        - evidence
        - detectedSignals
        - resolved
        - createdAt

    IdentityFingerprint:
      type: object
      properties:
        totalPhotosIndexed:
          type: integer
        totalCaptionsIndexed:
          type: integer
        reelsIndexed:
          type: integer
        monitoredAccounts:
          type: integer
        lastUpdated:
          type: string
          nullable: true
        platforms:
          type: array
          items:
            type: string
      required:
        - totalPhotosIndexed
        - totalCaptionsIndexed
        - reelsIndexed
        - monitoredAccounts
        - platforms

    AnalyzeScamBody:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 5000
      required:
        - text

    ScamAnalysisResult:
      type: object
      properties:
        riskScore:
          type: integer
          minimum: 0
          maximum: 100
        riskLevel:
          type: string
          enum: [low, medium, high]
        detectedPatterns:
          type: array
          items:
            type: string
        explanation:
          type: string
        recommendation:
          type: string
        analyzedAt:
          type: string
      required:
        - riskScore
        - riskLevel
        - detectedPatterns
        - explanation
        - recommendation
        - analyzedAt

    GenerateExplanationBody:
      type: object
      properties:
        threatId:
          type: string
        threatType:
          type: string
        signals:
          type: array
          items:
            type: string
        matchedMediaCount:
          type: integer
        platform:
          type: string
          nullable: true
        suspiciousUsername:
          type: string
          nullable: true
      required:
        - threatType
        - signals
        - matchedMediaCount

    ExplanationResult:
      type: object
      properties:
        explanation:
          type: string
        generatedAt:
          type: string
      required:
        - explanation
        - generatedAt

    WaitlistInput:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email

    WaitlistEntry:
      type: object
      required:
        - id
        - email
        - createdAt
        - alreadyRegistered
      properties:
        id:
          type: string
        email:
          type: string
        createdAt:
          type: string
        alreadyRegistered:
          type: boolean

    ReviewerDemoResponse:
      type: object
      required:
        - version
        - mode
        - isSample
        - actions
        - notice
        - accounts
        - mediaByAccount
        - threats
        - profileSummary
        - identityBadge
        - consent
        - quota
        - latestScan
        - scanHistory
        - capabilities
      properties:
        version:
          type: integer
          const: 1
        mode:
          type: string
          const: reviewer_demo
        isSample:
          type: boolean
          const: true
        actions:
          type: string
          const: local_preview_only
        notice:
          type: string
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/ReviewerDemoAccount"
        mediaByAccount:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ReviewerDemoMediaResponse"
        threats:
          type: array
          items:
            $ref: "#/components/schemas/ReviewerDemoThreatDetail"
        profileSummary:
          $ref: "#/components/schemas/ReviewerDemoProfileSummary"
        identityBadge:
          $ref: "#/components/schemas/ReviewerDemoIdentityBadge"
        consent:
          $ref: "#/components/schemas/ReviewerDemoConsent"
        quota:
          $ref: "#/components/schemas/ReviewerDemoQuota"
        latestScan:
          $ref: "#/components/schemas/ReviewerDemoScan"
        scanHistory:
          type: array
          items:
            $ref: "#/components/schemas/ReviewerDemoScan"
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/ReviewerDemoCapability"

    ReviewerDemoAccount:
      type: object
      required:
        - id
        - platform
        - username
        - displayName
        - followers
        - verified
        - needsReconnect
        - photosIndexed
        - captionsIndexed
        - reelsIndexed
        - lastSynced
        - connectionType
        - isSample
        - profileUrl
      properties:
        id:
          type: string
          pattern: "^review-demo-"
        platform:
          type: string
          enum: [instagram, x, tiktok, linkedin, youtube, facebook, snapchat]
        username:
          type: string
        displayName:
          type: string
        followers:
          type: integer
        verified:
          type: boolean
          const: false
        needsReconnect:
          type: boolean
        photosIndexed:
          type: integer
        captionsIndexed:
          type: integer
        reelsIndexed:
          type: integer
        lastSynced:
          type: string
        connectionType:
          type: string
          const: demo
        isSample:
          type: boolean
          const: true
        profileUrl:
          type: ["string", "null"]

    ReviewerDemoMediaResponse:
      type: object
      required: [items, hasAccess, isSample]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReviewerDemoMediaItem"
        hasAccess:
          type: boolean
        reason:
          type: string
        isSample:
          type: boolean
          const: true

    ReviewerDemoMediaItem:
      type: object
      required: [id, type, url, thumbnailUrl, caption, postedAt]
      properties:
        id:
          type: string
          pattern: "^review-demo-"
        type:
          type: string
          enum: [image, video, carousel]
        url:
          type: string
        thumbnailUrl:
          type: string
        caption:
          type: ["string", "null"]
        postedAt:
          type: ["string", "null"]

    ReviewerDemoThreatDetail:
      type: object
      required:
        - id
        - scanJobId
        - type
        - severity
        - platform
        - title
        - description
        - details
        - aiExplanation
        - threatScore
        - suspiciousUsername
        - profileUrl
        - matchedMediaCount
        - evidence
        - scoreBreakdown
        - accountMeta
        - detectedSignals
        - isSample
        - confirmedVictims
        - crossUserEscalation
        - postDatingDays
        - resolved
        - resolvedAt
        - resolveAction
        - isLocked
        - createdAt
      properties:
        id:
          type: string
          pattern: "^review-demo-threat-"
        scanJobId:
          type: string
          pattern: "^review-demo-"
        type:
          type: string
        severity:
          type: string
          enum: [high, medium, low]
        platform:
          type: string
        title:
          type: string
        description:
          type: string
        details:
          type: string
        aiExplanation:
          type: string
        threatScore:
          type: integer
        suspiciousUsername:
          type: ["string", "null"]
        profileUrl:
          type: ["string", "null"]
        matchedMediaCount:
          type: integer
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/ReviewerDemoThreatEvidence"
        scoreBreakdown:
          $ref: "#/components/schemas/ThreatScoreBreakdown"
        accountMeta:
          oneOf:
            - $ref: "#/components/schemas/ReviewerDemoAccountMeta"
            - type: "null"
        detectedSignals:
          type: array
          items:
            type: string
        isSample:
          type: boolean
          const: true
        confirmedVictims:
          type: ["integer", "null"]
        crossUserEscalation:
          type: boolean
        postDatingDays:
          type: ["integer", "null"]
        resolved:
          type: boolean
        resolvedAt:
          type: ["string", "null"]
        resolveAction:
          type: ["string", "null"]
        isLocked:
          type: boolean
          const: false
        createdAt:
          type: string

    ReviewerDemoThreatEvidence:
      type: object
      required: [id, type, similarity, label]
      properties:
        id:
          type: string
          pattern: "^review-demo-"
        type:
          type: string
        similarity:
          type: integer
        label:
          type: string
        yourCaption:
          type: string
        stolenCaption:
          type: string
        yourPhotoUrl:
          type: string
        stolenPhotoUrl:
          type: string

    ReviewerDemoAccountMeta:
      type: object
      required: [followers]
      properties:
        followers:
          type: integer
        following:
          type: integer
        totalPosts:
          type: integer
        accountAgeDays:
          type: integer
        engagementRate:
          type: number

    ReviewerDemoProfileSummary:
      type: object
      required:
        - securityScore
        - scoreTrend
        - monitored
        - lastScan
        - totalPhotosIndexed
        - totalCaptionsIndexed
        - reelsIndexed
        - fingerprintUpdated
        - isSample
      properties:
        securityScore:
          type: integer
        scoreTrend:
          type: integer
        monitored:
          type: integer
        lastScan:
          type: string
        totalPhotosIndexed:
          type: integer
        totalCaptionsIndexed:
          type: integer
        reelsIndexed:
          type: integer
        fingerprintUpdated:
          type: string
        isSample:
          type: boolean
          const: true

    ReviewerDemoIdentityBadge:
      type: object
      required:
        - userId
        - confidenceTier
        - overallConfidence
        - verifiedPlatformCount
        - anchorHashCount
        - verifiedPlatforms
        - badge
        - isSample
      properties:
        userId:
          type: string
          pattern: "^review-demo-"
        confidenceTier:
          type: string
          enum: [UNVERIFIED, LOW, MEDIUM, HIGH, STRONG]
        overallConfidence:
          type: integer
        verifiedPlatformCount:
          type: integer
        anchorHashCount:
          type: integer
        verifiedPlatforms:
          type: array
          items:
            type: string
        badge:
          type: object
          required: [tier, label, description, color]
          properties:
            tier:
              type: string
            label:
              type: string
            description:
              type: string
            color:
              type: string
        isSample:
          type: boolean
          const: true

    ReviewerDemoConsent:
      type: object
      required: [hasConsent, consentedAt, consentVersion, isSample]
      properties:
        hasConsent:
          type: boolean
        consentedAt:
          type: ["string", "null"]
        consentVersion:
          type: ["string", "null"]
        isSample:
          type: boolean
          const: true

    ReviewerDemoQuota:
      type: object
      required:
        - canScan
        - scansUsed
        - scansAllowed
        - tier
        - imagesPerScan
        - upgradeTo
        - message
        - resetsAt
        - isSample
      properties:
        canScan:
